<script>
document.addEventListener('DOMContentLoaded', function() {
  // 현재 테마를 실제 적용된 스타일시트에서 읽음 (첫 로드 시 'default' = dark 취급)
  function getTheme() {
    return (typeof jtd !== 'undefined' && jtd.getTheme() === 'light') ? 'light' : 'dark';
  }
  function setLabels(theme) {
    document.querySelectorAll('.theme-toggle-btn').forEach(function(btn) {
      btn.textContent = theme === 'dark' ? 'View in Light Mode' : 'View in Dark Mode';
    });
  }

  // 저장된 선택 복원
  var saved = localStorage.getItem('jtd-theme');
  if (saved === 'light' || saved === 'dark') jtd.setTheme(saved);
  setLabels(getTheme());

  // 데스크탑 사이드바 + 모바일 푸터 버튼 모두에 연결
  document.querySelectorAll('.theme-toggle-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var next = getTheme() === 'dark' ? 'light' : 'dark';
      jtd.setTheme(next);
      localStorage.setItem('jtd-theme', next);
      setLabels(next);
    });
  });
});
</script>
