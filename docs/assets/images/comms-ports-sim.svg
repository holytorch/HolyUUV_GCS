<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5fbfd6"/>
    </marker>
  </defs>

  <!-- 127.0.0.1 한 머신 컨테이너 (시뮬은 모두 같은 IP) -->
  <rect x="12" y="14" width="976" height="332" rx="14" fill="none" stroke="#3a5566" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="34" y="38" fill="#8faabc" font-size="13" font-weight="700">127.0.0.1 — one machine (simulator): everything shares the same IP</text>

  <!-- ── robot 1 ── -->
  <rect x="40" y="66" width="220" height="64" rx="9" fill="#16212b" stroke="#2f4250" stroke-width="1.5"/>
  <text x="150" y="93"  text-anchor="middle" fill="#e6eef0" font-size="14" font-weight="700">ArduSub FC</text>
  <text x="150" y="113" text-anchor="middle" fill="#8aa0ad" font-size="11">-I0 · sysid 1</text>

  <rect x="400" y="66" width="220" height="64" rx="9" fill="#16212b" stroke="#2f4250" stroke-width="1.5"/>
  <text x="510" y="93"  text-anchor="middle" fill="#e6eef0" font-size="14" font-weight="700">MAVROS</text>
  <text x="510" y="113" text-anchor="middle" fill="#8aa0ad" font-size="11">/mavros</text>

  <!-- ── robot 2 ── -->
  <rect x="40" y="226" width="220" height="64" rx="9" fill="#16212b" stroke="#2f4250" stroke-width="1.5"/>
  <text x="150" y="253" text-anchor="middle" fill="#e6eef0" font-size="14" font-weight="700">ArduSub FC</text>
  <text x="150" y="273" text-anchor="middle" fill="#8aa0ad" font-size="11">-I1 · sysid 2</text>

  <rect x="400" y="226" width="220" height="64" rx="9" fill="#16212b" stroke="#2f4250" stroke-width="1.5"/>
  <text x="510" y="253" text-anchor="middle" fill="#e6eef0" font-size="14" font-weight="700">MAVROS</text>
  <text x="510" y="273" text-anchor="middle" fill="#8aa0ad" font-size="11">/bluerov2_2</text>

  <!-- ── GCS ── -->
  <rect x="770" y="138" width="200" height="80" rx="9" fill="#16212b" stroke="#2f4250" stroke-width="1.5"/>
  <text x="870" y="172" text-anchor="middle" fill="#e6eef0" font-size="15" font-weight="700">HolyUUV GCS</text>
  <text x="870" y="192" text-anchor="middle" fill="#8aa0ad" font-size="11">binds udp 14550</text>

  <!-- FC ↔ MAVROS : 5000번대, 인스턴스마다 (+10) -->
  <line x1="260" y1="98"  x2="400" y2="98"  stroke="#5fbfd6" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="330" y="89"  text-anchor="middle" fill="#9fb6c4" font-size="11" font-weight="600">tcp 5760</text>
  <line x1="260" y1="258" x2="400" y2="258" stroke="#5fbfd6" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="330" y="249" text-anchor="middle" fill="#9fb6c4" font-size="11" font-weight="600">tcp 5770</text>

  <!-- MAVROS → GCS : 14550 공유 -->
  <path d="M620,98  C710,98  720,160 770,166" fill="none" stroke="#5fbfd6" stroke-width="2" marker-end="url(#a)"/>
  <path d="M620,258 C710,258 720,196 770,190" fill="none" stroke="#5fbfd6" stroke-width="2" marker-end="url(#a)"/>
  <text x="703" y="118" text-anchor="middle" fill="#9fb6c4" font-size="11" font-weight="600">udp 14550</text>
  <text x="703" y="250" text-anchor="middle" fill="#9fb6c4" font-size="11" font-weight="600">udp 14550</text>

  <!-- 캡션 -->
  <text x="330" y="324" text-anchor="middle" fill="#6b8290" font-size="11">FC ↔ companion (MAVROS): 5000-range, one per instance (+10)</text>
  <text x="800" y="324" text-anchor="middle" fill="#6b8290" font-size="11">robot ↔ GCS: 14550, shared — robots told apart by sysid</text>
</svg>
